<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Devin Desktop vs All // NEON GRID</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05010d;
            --magenta: #ff2bd6;
            --cyan: #00f0ff;
            --yellow: #fcee0a;
            --green: #39ff14;
            --red: #ff003c;
            --panel-bg: rgba(8, 3, 22, 0.72);
            --font-title: 'Orbitron', 'Share Tech Mono', monospace;
            --font-body: 'Share Tech Mono', monospace;
            --cut: 12px;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg);
            font-family: var(--font-body);
            color: var(--cyan);
        }
        #gameCanvas {
            display: block;
            background-color: var(--bg);
        }

        .hud-panel {
            position: absolute;
            background: var(--panel-bg);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            border: 1px solid var(--cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.35), inset 0 0 14px rgba(0, 240, 255, 0.08);
            clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
            box-sizing: border-box;
        }
        .panel-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-title);
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--magenta);
            text-transform: uppercase;
        }
        .panel-label svg {
            width: 14px;
            height: 14px;
            flex: none;
        }
        svg.neon {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #score-panel {
            top: 14px;
            left: 14px;
            padding: 8px 18px 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-color: var(--yellow);
            box-shadow: 0 0 12px rgba(252, 238, 10, 0.3), inset 0 0 14px rgba(252, 238, 10, 0.06);
        }
        #score-panel svg {
            width: 22px;
            height: 22px;
            color: var(--yellow);
            filter: drop-shadow(0 0 4px var(--yellow));
        }
        #score {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 2px;
            color: var(--yellow);
            text-shadow: 0 0 8px rgba(252, 238, 10, 0.7);
        }

        #leaderboard {
            top: 14px;
            right: 14px;
            padding: 12px 14px 12px 16px;
            min-width: 200px;
            color: #e8faff;
        }
        #leaderboard h3 {
            margin: 0 0 10px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 43, 214, 0.5);
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin: 5px 0;
            font-size: 14px;
            color: rgba(232, 250, 255, 0.85);
        }
        .leaderboard-item.top-rank {
            color: var(--yellow);
            text-shadow: 0 0 6px rgba(252, 238, 10, 0.6);
        }
        .leaderboard-item .player-name,
        .player-name {
            color: var(--cyan);
            text-shadow: 0 0 6px rgba(0, 240, 255, 0.8);
        }

        #radar-panel {
            bottom: 20px;
            left: 20px;
            padding: 8px 10px 10px;
            border-color: var(--magenta);
            box-shadow: 0 0 12px rgba(255, 43, 214, 0.35), inset 0 0 14px rgba(255, 43, 214, 0.08);
        }
        #radar-panel .panel-label {
            margin-bottom: 6px;
        }
        #minimap {
            display: block;
            border: 1px solid rgba(0, 240, 255, 0.4);
        }

        #settings-icon {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: var(--panel-bg);
            border: 1px solid var(--cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            color: var(--cyan);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: background-color 0.2s, color 0.2s, box-shadow 0.2s;
        }
        #settings-icon:hover {
            background-color: rgba(0, 240, 255, 0.18);
            color: #fff;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.8);
        }
        #settings-icon svg {
            width: 26px;
            height: 26px;
        }

        #settings-panel {
            bottom: 76px;
            right: 20px;
            width: 320px;
            padding: 18px 20px;
            color: #e8faff;
            border-color: var(--magenta);
            box-shadow: 0 0 16px rgba(255, 43, 214, 0.4), inset 0 0 18px rgba(255, 43, 214, 0.08);
            display: none;
            transform-origin: bottom right;
            transition: transform 0.3s, opacity 0.3s;
            opacity: 0;
            transform: scale(0.95);
        }
        #settings-panel.visible {
            display: block;
            opacity: 1;
            transform: scale(1);
        }
        #settings-panel h2 {
            margin: 0 0 14px 0;
            font-family: var(--font-title);
            font-size: 16px;
            letter-spacing: 3px;
            color: var(--magenta);
            text-shadow: 0 0 8px rgba(255, 43, 214, 0.7);
        }
        .control-group {
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
        }
        .control-group:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .control-group h3 {
            margin: 0 0 8px 0;
            font-family: var(--font-title);
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--yellow);
        }
        .control-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0;
            font-size: 14px;
        }
        .control-action {
            color: var(--cyan);
        }
        .button {
            background-color: transparent;
            color: var(--cyan);
            border: 1px solid var(--cyan);
            padding: 8px 16px;
            cursor: pointer;
            font-family: var(--font-title);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            transition: background-color 0.2s, color 0.2s, box-shadow 0.2s;
        }
        .button:hover {
            background-color: var(--cyan);
            color: var(--bg);
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.8);
        }
        .button-danger {
            color: var(--red);
            border-color: var(--red);
            box-shadow: 0 0 8px rgba(255, 0, 60, 0.4);
        }
        .button-danger:hover {
            background-color: var(--red);
            color: #fff;
            box-shadow: 0 0 16px rgba(255, 0, 60, 0.8);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 22px;
        }
        .toggle-switch input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            cursor: pointer;
            z-index: 1;
        }
        .toggle-slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 1px solid rgba(0, 240, 255, 0.5);
            background-color: rgba(0, 240, 255, 0.05);
            transition: .3s;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            top: 3px;
            background-color: rgba(0, 240, 255, 0.5);
            transition: .3s;
        }
        input:checked + .toggle-slider {
            border-color: var(--green);
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
        }
        input:checked + .toggle-slider:before {
            background-color: var(--green);
            transform: translateX(24px);
        }
        input:focus-visible + .toggle-slider {
            outline: 2px solid var(--yellow);
            outline-offset: 2px;
        }

        #join-screen {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background-color: rgba(5, 1, 13, 0.7);
        }
        #join-screen.visible {
            display: flex;
        }
        #join-form {
            position: relative;
            background: var(--panel-bg);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border: 1px solid var(--cyan);
            box-shadow: 0 0 24px rgba(0, 240, 255, 0.4), inset 0 0 24px rgba(255, 43, 214, 0.1);
            clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
            color: #e8faff;
            padding: 34px 32px 30px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 320px;
        }
        #join-title {
            position: relative;
            margin: 0;
            font-family: var(--font-title);
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 3px;
            color: var(--cyan);
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }
        #name-input {
            padding: 10px 12px;
            font-family: var(--font-body);
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--cyan);
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 240, 255, 0.5);
            outline: none;
        }
        #name-input::placeholder {
            color: rgba(0, 240, 255, 0.4);
        }
        #name-input:focus {
            border-color: var(--magenta);
            box-shadow: 0 0 10px rgba(255, 43, 214, 0.6);
        }
        #join-form .button {
            padding: 12px 16px;
            font-size: 15px;
        }

        #fx-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            display: none;
            background:
                radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%),
                repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.22) 3px, rgba(0, 0, 0, 0) 4px);
        }
        html:not([data-fx="off"]) #fx-overlay {
            display: block;
        }

        html:not([data-fx="off"]) .hud-panel {
            animation: panel-flicker 6s infinite;
        }
        @keyframes panel-flicker {
            0%, 92%, 100% { opacity: 1; }
            94% { opacity: 0.82; }
            96% { opacity: 1; }
            97% { opacity: 0.88; }
        }

        html:not([data-fx="off"]) #join-title::before,
        html:not([data-fx="off"]) #join-title::after {
            content: attr(data-text);
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        html:not([data-fx="off"]) #join-title::before {
            color: var(--magenta);
            text-shadow: none;
            animation: glitch-a 3s infinite steps(1);
        }
        html:not([data-fx="off"]) #join-title::after {
            color: var(--yellow);
            text-shadow: none;
            animation: glitch-b 3s infinite steps(1);
        }
        @keyframes glitch-a {
            0%, 90%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
            91% { clip-path: inset(10% 0 55% 0); transform: translate(-3px, 0); }
            94% { clip-path: inset(60% 0 8% 0); transform: translate(3px, 0); }
            97% { clip-path: inset(30% 0 40% 0); transform: translate(-2px, 0); }
        }
        @keyframes glitch-b {
            0%, 91%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
            92% { clip-path: inset(50% 0 20% 0); transform: translate(3px, 0); }
            95% { clip-path: inset(5% 0 70% 0); transform: translate(-3px, 0); }
            98% { clip-path: inset(75% 0 5% 0); transform: translate(2px, 0); }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="score-panel" class="hud-panel">
        <svg class="neon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12"/>
            <path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>
            <path d="M9.5 9.5L12 13l2.5-3.5M9.5 13.5h5M9.5 11.5h5"/>
        </svg>
        <div id="score">CREDITS: 0</div>
    </div>
    <div id="leaderboard" class="hud-panel">
        <h3 class="panel-label">
            <svg class="neon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/>
                <circle cx="12" cy="8" r="4"/>
                <path d="M9 8h6"/>
            </svg>
            NETRUNNERS
        </h3>
        <div id="leaderboard-content"></div>
    </div>
    <div id="radar-panel" class="hud-panel">
        <div class="panel-label">
            <svg class="neon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8"/>
                <path d="M12 2v5M12 17v5M2 12h5M17 12h5"/>
            </svg>
            RADAR
        </div>
        <canvas id="minimap" width="150" height="150"></canvas>
    </div>
    <div id="join-screen">
        <form id="join-form">
            <h2 id="join-title" data-text="JACK IN TO THE GRID">JACK IN TO THE GRID</h2>
            <input id="name-input" type="text" maxlength="16" placeholder="HANDLE" autocomplete="off">
            <button class="button" type="submit">JACK IN</button>
        </form>
    </div>
    <div id="settings-icon">
        <svg class="neon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10"/>
            <rect x="10" y="10" width="4" height="4"/>
            <path d="M9 7V3M12 7V3M15 7V3M9 21v-4M12 21v-4M15 21v-4M7 9H3M7 12H3M7 15H3M21 9h-4M21 12h-4M21 15h-4"/>
        </svg>
    </div>
    <div id="settings-panel" class="hud-panel">
        <h2>SYS://CONFIG</h2>
        <div class="control-group">
            <h3>MOVEMENT</h3>
            <div class="control-item">
                <span>Move cells</span>
                <span class="control-action">NEURAL LINK (MOUSE)</span>
            </div>
        </div>
        <div class="control-group">
            <h3>ACTIONS</h3>
            <div class="control-item">
                <span>Split cells</span>
                <span class="control-action">LEFT CLICK</span>
            </div>
        </div>
        <div class="control-group">
            <h3>DISPLAY</h3>
            <div class="control-item">
                <span>CRT / GLITCH FX</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="fx-toggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>
        <div class="control-group">
            <h3>SYSTEM</h3>
            <div class="control-item">
                <span>Restart game</span>
                <button class="button button-danger" onclick="window.location.reload()">REBOOT</button>
            </div>
        </div>
    </div>
    <div id="fx-overlay" aria-hidden="true"></div>
    <script type="module" src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
